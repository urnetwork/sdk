    url: https://gitlab.gnome.org/GNOME/libsecret
    spdx: LGPL-2.1-or-later
    copyright: Copyright (C) The libsecret authors
    text_file: texts/LGPL-2.1-or-later.txt

  # Open fonts served by ur.io (react/public/fonts; Manrope and Urbanist are
