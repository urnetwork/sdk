# Hand-kept license entries: the ones no package manager can report.
#
# `go run ./licenses` merges these with the entries it discovers (Go modules,
# npm, Maven, Swift packages) into ../license.yml. Add an entry here when an app
# starts shipping data, a font or a vendored library that did not come from a
# package manager, and regenerate.
#
# Fields:
#   name, version, url, spdx, copyright, notice: shown as-is
#   kind: data | software | font
#   origin: data | vendored | font
#   apps: any of android, apple, windows, linux, web, extension; or [all]
#   text_file: the license text, relative to this directory
#   text: the license text inline, when there is no file

entries:
  # IP location data. The apps and ur.io show city, region, country and time
  # zone from the API's GeoLite2 lookup; the GeoLite2 EULA requires this notice
  # wherever that data is shown, and the place names in it are GeoNames data
  # under CC BY 4.0.
  - name: GeoLite2 by MaxMind
    kind: data
    origin: data
    apps: [all]
    url: https://www.maxmind.com
    spdx: LicenseRef-MaxMind-GeoLite2-EULA
    notice: This product includes GeoLite2 data created by MaxMind, available from https://www.maxmind.com.
    text_file: texts/GeoLite2.txt
  - name: GeoNames
    kind: data
    origin: data
    apps: [all]
    url: https://www.geonames.org
    spdx: CC-BY-4.0
    notice: GeoLite2 incorporates GeoNames data, available under CC BY 4.0.
    text_file: texts/CC-BY-4.0.txt

  # The ad and tracker blocklist compiled into connect (connect/ip_blocker_block.go,
  # composition in sdk/BLOCKER.md). Every build of the SDK carries it.
  - name: ShadowWhisperer BlockLists
    kind: data
    origin: data
    apps: [all]
    url: https://github.com/ShadowWhisperer/BlockLists
    spdx: Unlicense
    text_file: texts/blocklist-shadowwhisperer.txt
  - name: anudeepND blacklist
    kind: data
    origin: data
    apps: [all]
    url: https://github.com/anudeepND/blacklist
    spdx: MIT
    text_file: texts/blocklist-anudeepnd-blacklist.txt
  - name: anudeepND whitelist
    kind: data
    origin: data
    apps: [all]
    url: https://github.com/anudeepND/whitelist
    spdx: MIT
    text_file: texts/blocklist-anudeepnd-whitelist.txt
  - name: Geoffrey Frogeye tracker lists
    kind: data
    origin: data
    apps: [all]
    url: https://hostfiles.frogeye.fr
    spdx: MIT
    text_file: texts/blocklist-frogeye.txt
  - name: hostsVN
    kind: data
    origin: data
    apps: [all]
    url: https://github.com/bigdargon/hostsVN
    spdx: MIT
    text_file: texts/blocklist-hostsvn.txt

  # The provider-locations globe: world-110m.json from world-atlas, drawn from
  # Natural Earth. The native apps bundle the file; ur.io gets it from npm.
  - name: Natural Earth
    kind: data
    origin: data
    apps: [android, apple, windows, linux, web]
    url: https://www.naturalearthdata.com
    spdx: LicenseRef-Public-Domain
    text_file: texts/Natural-Earth.txt
  - name: world-atlas
    kind: data
    origin: data
    apps: [android, apple, windows, linux]
    url: https://github.com/topojson/world-atlas
    spdx: ISC
    copyright: Copyright 2013-2019 Michael Bostock
    text_file: texts/ISC.txt

  # goidenticons (github.com/urnetwork/goidenticons, MPL-2.0, listed by the Go
  # collector) is our port of Nanoidenticons, which is based on Blockies.
  # WTFPL has no conditions; this credits the upstream design.
  - name: Nanoidenticons
    kind: software
    origin: vendored
    apps: [all]
    url: https://github.com/keerifox/Nanoidenticons
    spdx: WTFPL
    text: |
      goidenticons (https://github.com/urnetwork/goidenticons) is a Go port of
      Nanoidenticons (https://github.com/keerifox/Nanoidenticons), itself based
      on Blockies (https://github.com/download13/blockies). Nanoidenticons is
      released under the WTFPL, version 2 (http://www.wtfpl.net/).

  # Windows: vendored and vcpkg C/C++ libraries (windows/app/THIRD-PARTY-NOTICES.txt)
  - name: Wintun
    version: 0.14.1
    kind: software
    origin: vendored
    apps: [windows]
    url: https://www.wintun.net
    spdx: LicenseRef-Wintun-Prebuilt-Binaries
    copyright: Copyright (C) WireGuard LLC. Wintun is a trademark of Jason A. Donenfeld.
    text_file: texts/Wintun-Prebuilt-Binaries.txt
  - name: nlohmann/json
    kind: software
    origin: vendored
    apps: [windows, linux]
    url: https://github.com/nlohmann/json
    spdx: MIT
    copyright: Copyright (c) 2013-2022 Niels Lohmann
    text_file: texts/MIT.txt
  - name: Windows Implementation Libraries (WIL)
    kind: software
    origin: vendored
    apps: [windows]
    url: https://github.com/microsoft/wil
    spdx: MIT
    copyright: Copyright (c) Microsoft Corporation
    text_file: texts/MIT.txt
  - name: QR Code generator library (C++)
    version: 1.8.0
    kind: software
    origin: vendored
    apps: [windows, linux]
    url: https://www.nayuki.io/page/qr-code-generator-library
    spdx: MIT
    copyright: Copyright (c) Project Nayuki
    text_file: texts/MIT.txt
  - name: zxing-cpp
    version: 2.2.1
    kind: software
    origin: vendored
    apps: [windows, linux]
    url: https://github.com/zxing-cpp/zxing-cpp
    spdx: Apache-2.0
    copyright: Copyright (c) ZXing authors and the zxing-cpp contributors
    text_file: texts/Apache-2.0.txt

  # Linux: the GTK stack the AppImage bundles (linux/APPIMAGE.md: "the GUI
  # still carries the whole GTK stack"). The LGPL libraries are listed here;
  # the permissively licensed rest of the bundle (HarfBuzz, FreeType,
  # fontconfig, libepoxy, graphene, ...) still needs enumerating from a built
