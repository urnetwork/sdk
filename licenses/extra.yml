    text_file: texts/LGPL-2.1-or-later.txt
  - name: GTK
    kind: software
    origin: vendored
    apps: [linux]
    url: https://www.gtk.org
    spdx: LGPL-2.1-or-later
    copyright: Copyright (C) The GTK Team
    text_file: texts/LGPL-2.1-or-later.txt
  - name: GLib
    kind: software
    origin: vendored
    apps: [linux]
    url: https://gitlab.gnome.org/GNOME/glib
    spdx: LGPL-2.1-or-later
    copyright: Copyright (C) The GLib Team
    text_file: texts/LGPL-2.1-or-later.txt
  - name: Pango
    kind: software
    origin: vendored
    apps: [linux]
    url: https://gitlab.gnome.org/GNOME/pango
    spdx: LGPL-2.1-or-later
    copyright: Copyright (C) The Pango Team
    text_file: texts/LGPL-2.1-or-later.txt
  - name: GdkPixbuf
    kind: software
    origin: vendored
    apps: [linux]
    url: https://gitlab.gnome.org/GNOME/gdk-pixbuf
    spdx: LGPL-2.1-or-later
    copyright: Copyright (C) The GdkPixbuf Team
    text_file: texts/LGPL-2.1-or-later.txt
  - name: cairo
    kind: software
    origin: vendored
    apps: [linux]
    url: https://www.cairographics.org
    spdx: LGPL-2.1-only OR MPL-1.1
    copyright: Copyright (C) The cairo authors
    text_file: texts/LGPL-2.1-or-later.txt
  - name: FriBidi
    kind: software
    origin: vendored
    apps: [linux]
    url: https://github.com/fribidi/fribidi
    spdx: LGPL-2.1-or-later
    copyright: Copyright (C) The FriBidi authors
    text_file: texts/LGPL-2.1-or-later.txt
  - name: libsecret
    kind: software
