# Go modules the collector does not list (each needs an entry above that
# credits it instead)
skip_go_modules: []

# npm production dependencies that only run at build time (bundlers, the
# static site generator, test drivers): the collector does not follow them.
npm_build_only:
  - playwright
  - "@astrojs/sitemap"
  - "@crxjs/vite-plugin"
  - "@tailwindcss/vite"
  - vite-plugin-zip-pack

# npm dependencies whose own client runtime ships in the bundle but whose
# dependency tree is build tooling: listed, not followed.
npm_shallow:
  - astro
  - "@astrojs/react"
  # tailwind v4 writes its preflight css, with its license header, into the
  # shipped stylesheet
  - tailwindcss
