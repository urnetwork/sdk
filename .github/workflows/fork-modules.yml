# THE FORK'S CHECK OVER EVERY sdk MODULE THAT test.yml DOES NOT REACH. FORK-ONLY: the
# upstream branch drops this file (msgrepo ledger 277).
#
# test.yml runs `go test ./...` from the root, and a Go module boundary stops it. sdk has nine
# go.mod files; the root is test.yml's, and this job covers the other eight:
#   cgo        `go test ./...`: the C ABI, gen's currentness test and upstream's build-contract
#              tests. Plus a build of the loopback module file `make ctest` builds with, which the
#              2026-10-03 merge broke. `make ctest` itself stays Windows-only: its C program
#              includes windows.h for its threads, so no Linux host can run it.
#   cp3b       URmessage's end-to-end suite, against the fork's message-server
#   packaging  the package-manager manifests and the generated language bindings
#   build      the gomobile module: zsh for the three tests that drive test.sh, and a warm module
#              cache for gobind, which its tests run with GOPROXY=off
#   js         under GOOS=js GOARCH=wasm, run by node
#   livepeer, liveprobe   vetted: each is one main.go with no tests
#   cgo/build  no code at all: it is the module boundary that build output sits behind
# If a module is added, add it here: this list is what the job claims, and a module missing from
# it is the narrowing the job exists to prevent (items 269 and 277 recorded it twice).
#
# The siblings are the fork's connect and message-server: they carry the URmessage packages the
# modules import, which upstream does not have until its pull requests land.
name: Fork - every sdk module

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    name: cgo, cp3b, livepeer, liveprobe
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out sdk
        uses: actions/checkout@v4

      - name: Check out the siblings the modules replace to
        run: |
          set -eu
          git clone --depth 1 https://github.com/Ryanmello07/connect.git ../connect
          git clone --depth 1 https://github.com/urnetwork/glog.git ../glog
          git clone --depth 1 https://github.com/urnetwork/goidenticons.git ../goidenticons
          git clone --depth 1 --branch go https://github.com/urnetwork/gvisor.git ../gvisor
          git clone --depth 1 https://github.com/Ryanmello07/urnetwork-message-server.git ../message-server
          git clone --depth 1 --filter=blob:none --sparse https://github.com/urnetwork/server.git ../server
          git -C ../server sparse-checkout set api

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cgo/go.mod

      # Each step runs even when an earlier one failed, so one red module never hides another.
      - name: cgo (cgo, gen, buildcontract)
        if: always()
        working-directory: cgo
        run: go test ./... -count=1 -timeout 30m

      - name: cp3b
        if: always()
        working-directory: cp3b
        run: go test ./... -count=1 -timeout 30m

      - name: livepeer and liveprobe vet
        if: always()
        run: |
          set -eu
          (cd livepeer && go vet ./...)
          (cd liveprobe && go vet ./...)

      - name: cgo loopback build (the module file make ctest builds with)
        if: always()
        working-directory: cgo
        run: |
          set -eu
          CGO_ENABLED=1 go build -modfile=loopback.go.mod -tags urnet_message_loopback -buildmode=c-shared -o "$RUNNER_TEMP/loopback.so" .
          CGO_ENABLED=1 go vet -modfile=loopback.go.mod -tags urnet_message_loopback .

      - name: packaging
        if: always()
        working-directory: packaging
        run: go test ./... -count=1 -timeout 20m

      - name: build (the gomobile module)
        if: always()
        working-directory: build
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          # mobileexports runs gobind with GOPROXY=off, so the cache must already hold x/mobile
          go mod download
          go test ./... -count=1 -timeout 20m

      - name: js (GOOS=js GOARCH=wasm, under node)
        if: always()
        working-directory: js
        env:
          GOOS: js
          GOARCH: wasm
          GOEXPERIMENT: greenteagc
        run: |
          set -eu
          go vet ./...
          go test ./... -count=1 -timeout 20m -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec"
