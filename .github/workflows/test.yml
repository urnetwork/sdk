name: Test — sdk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Check out sdk
        uses: actions/checkout@v4

      # go.mod resolves these with `replace github.com/urnetwork/<x> => ../<x>`,
      # so they have to sit beside the checkout. The directory names must match
      # the replace targets exactly — `connect`, not whatever a fork is named.
      - name: Check out connect dependency
        run: git clone --depth 1 https://github.com/urnetwork/connect.git ../connect

      - name: Check out glog dependency
        run: git clone --depth 1 https://github.com/urnetwork/glog.git ../glog

      - name: Check out goidenticons dependency
        run: git clone --depth 1 https://github.com/urnetwork/goidenticons.git ../goidenticons

      # This go.mod and connect's both have `replace gvisor.dev/gvisor => ../gvisor`:
      # urnetwork's fork of gvisor, on its `go` branch, beside connect and this
      # checkout alike. Without it the build stops at "replacement directory
      # ../gvisor does not exist".
      - name: Check out gvisor dependency
        run: git clone --depth 1 --branch go https://github.com/urnetwork/gvisor.git ../gvisor

      # Read only by TestSdkApiUrlsMatchServerRoutes, which checks every api url
      # the sdk builds against the server's route table (api/api.go) and fails
      # under CI when the checkout is missing. Only api/ is checked out.
      - name: Check out server routes
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/urnetwork/server.git ../server
          git -C ../server sparse-checkout set api

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      # -count=1 defeats the test result cache so a green run always means the
      # tests actually ran.
      #
      # sdk/cgo is a separate Go module with its own go.mod, so `./...` does not
      # reach it. That is deliberate: it is also what keeps a cgo dependency
      # invisible to gomobile builds by construction.
      - name: Test
        run: go test -count=1 -timeout 20m ./...

  # The checks `./...` above cannot reach, because each lives in its own Go
  # module (or in js/): the committed C ABI, language bindings and JS sources
  # must equal a fresh generation, gomobile's omissions must match the mobile
  # export policy, and cp3b, livepeer and liveprobe must still compile. A
  # separate job keeps them off the go test job's critical path.
  generated:
    name: generated code and side modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out sdk
        uses: actions/checkout@v4

      # The go test job's siblings, for the same replace directives.
      - name: Check out connect dependency
        run: git clone --depth 1 https://github.com/urnetwork/connect.git ../connect

      - name: Check out glog dependency
        run: git clone --depth 1 https://github.com/urnetwork/glog.git ../glog

      - name: Check out goidenticons dependency
        run: git clone --depth 1 https://github.com/urnetwork/goidenticons.git ../goidenticons

      - name: Check out gvisor dependency
        run: git clone --depth 1 --branch go https://github.com/urnetwork/gvisor.git ../gvisor

      # cp3b, URmessage's end-to-end suite, also replaces
      # github.com/urnetwork/message-server => ../../message-server. Only the
      # cp3b build below reads it.
      - name: Check out message-server dependency
        run: git clone --depth 1 https://github.com/urnetwork/message-server.git ../message-server

      # The Go the release host builds the mobile SDKs with: build/all/run.sh
      # requires exactly 1.27.1. Pinned rather than `stable`, so a new Go
      # release cannot change it without a commit here. go 1.27 runs the
      # mobileexports tests' gobind since f36da2ab, which stopped setting
      # GODEBUG=gotypesalias=0 (go 1.27 removed that setting and exits at
      # startup while it is set).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      # The js tests run the TypeScript sources directly, which needs node's
      # type stripping and module.registerHooks.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Regenerates the C ABI (exports, callbacks, headers, .def, coverage
      # report) in a temporary directory and compares it with the committed
      # files, then runs the packaging module's check-generated against the
      # committed header.
      - name: Check C ABI is current
        working-directory: cgo
        run: go test -count=1 ./gen

      # Includes TestGeneratedBindingsMatchCurrentABI: the committed Python,
      # Java, C#, Rust and Ruby bindings must equal a generation from the
      # committed header.
      - name: Test language packaging
        run: go -C packaging test -count=1 ./...

      # src/generated: the API client from connect's api/bringyour.yml and the
      # types from the sdk's Go structs.
      - name: Check JS generated sources
        run: make -C js check_generated

      - name: Test JS
        working-directory: js
        run: npm test

      # The tests run gobind with GOPROXY=off, and the test package imports
      # only the standard library, so download x/mobile and the sdk's
      # dependencies first.
      - name: Test mobile export policy
        working-directory: build
        run: |
          go mod download
          go test -count=1 ./cmd/mobileexports

      # cp3b is test files only, so `go build` compiles nothing there: vet
      # compiles it, tests included, without running the suite. livepeer and
      # liveprobe are operator commands with no tests.
      - name: Build cp3b, livepeer and liveprobe
        run: |
          go -C cp3b vet ./...
          go -C livepeer build ./...
          go -C liveprobe build ./...
