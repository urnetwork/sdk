[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urnetwork-sdk"
version = "0.0.1.dev0"
description = "URnetwork userspace networking SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
authors = [{name = "URnetwork", email = "support@ur.io"}]

[project.urls]
Homepage = "https://ur.io/docs/getting-started-sdk"
Repository = "https://github.com/urnetwork/sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urnetwork = ["native/**/*", "py.typed"]
